name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ShellCheck is preinstalled on GitHub's Ubuntu runners.
      - name: Run ShellCheck
        run: |
          shellcheck --version
          shellcheck \
            Claude-Code/Linux/fix/claude-code-fix.sh \
            Cowork/Linux/fix/cowork-fix.sh \
            tests/linux-fix.sh

  linux-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs the fix script against fake installs in a throwaway home directory,
      # with a real qemu-x86_64.
      - name: Install QEMU user mode
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      - name: Test the Linux fix script
        run: bash tests/linux-fix.sh

  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
              Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $results = @('Claude-Code/Windows/fix/claude-code-fix.ps1', 'tests/windows-wrapper.ps1') |
              ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Settings ./PSScriptAnalyzerSettings.psd1 }
          $results | Format-Table RuleName, Severity, Line, Message -AutoSize -Wrap
          if ($results) { exit 1 }

  windows-wrapper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Builds the wrapper with .NET Framework's csc.exe, as the fix script does on
      # users' machines, and runs it against a fake SDE.
      - name: Test the compiled wrapper
        shell: pwsh
        run: ./tests/windows-wrapper.ps1
