name: ShellCheck

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ShellCheck is preinstalled on GitHub's Ubuntu runners.
      - name: Run ShellCheck
        run: |
          shellcheck --version
          shellcheck \
            Claude-Code/Linux/fix/claude-code-fix.sh \
            Cowork/Linux/fix/cowork-fix.sh
